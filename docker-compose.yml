services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lunix
      POSTGRES_PASSWORD: lunix
      POSTGRES_DB: lunixpanel
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunix -d lunixpanel"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://lunix:lunix@postgres:5432/lunixpanel
      REDIS_URL: redis://redis:6379
    expose: ["3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["25050:80", "25051:443"]
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
